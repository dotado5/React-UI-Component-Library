# Publishes the package to npm when a version tag (e.g. v0.1.0) is pushed.
#
# Flow:
#   1. You bump the version + create a matching tag with `npm version`.
#   2. You push the tag; this workflow runs.
#   3. It re-runs every quality gate, then publishes to npm.
#
# See docs/PUBLISHING.md for the full walkthrough and one-time setup
# (creating the NPM_TOKEN secret).

name: Release

# Only run for tags shaped like v1.2.3 (semver). Pushing a branch never triggers
# a publish — releases are always tag-driven.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  # Required so npm can attach a signed provenance statement to the release,
  # proving it was built by this workflow from this commit. Needs a public repo.
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # registry-url is what makes npm write an authenticated .npmrc, so the
      # publish step can use the NODE_AUTH_TOKEN below.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Safety check: the git tag and package.json version must agree, so you
      # can never accidentally publish 0.1.0 under a v0.2.0 tag (or vice versa).
      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag version:      $TAG_VERSION"
          echo "package.json ver: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION. Aborting."
            exit 1
          fi

      # Re-run the full gate suite. A tag should only publish if it is green,
      # independently of whatever CI ran on the branch.
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test with coverage
        run: npm run coverage
      - name: Build
        run: npm run build

      # --provenance publishes a signed build attestation (requires id-token
      # above + a public repo). --access public publishes it as a public package.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
